# SPDX-License-Identifier: GPL-3.0-or-later
# A fictional program for the demo set and the tests (D-108, D-112): a six-week mobility
# block with its exercises and drills in reference tables. Nothing here is a real program;
# the real ones (shoulder, fear of falling) come with their own modules and importers.
module: demo_program
name: Demo program
version: 1
kind: program
description: A fictional six-week mobility block, to show reference tables.

scales:
  sore: {min: 0, max: 10, direction: lower_better}

program:
  weeks: 6
  phases:
    - {name: Learn, weeks: [1, 3]}
    - {name: Load, weeks: [4, 6]}
  light_weeks: [3]

reference:
  exercises:
    label: Exercises
    tab: Exercises
    key: id
    fields:
      id: {type: text, help: "A short code, like A1"}
      name: {type: text, required: true}
      session: {type: choice, choices: [Warm-up, A, B]}  # the warm-up comes in both
      load_rule: {type: text, label: Load rule}
    per_week: {name: prescription, type: text}  # W1…W6: "3×10", "Skip"
  tracks:
    label: Tracks
    tab: Tracks
    key: id
    fields:
      id: {type: text}
      name: {type: text, required: true}
  measures:                     # retested now and then, all in one form (D-115)
    label: Measures
    tab: Measures
    key: id
    fields:
      id: {type: text}
      name: {type: text, required: true}
      unit: {type: text}
  drills:
    label: Drills
    tab: Drills
    key: id
    fields:
      id: {type: text}
      track: {type: ref, reference: tracks}
      order: {type: integer, min: 1}
      description: {type: text}

entities:
  session:
    label: Session
    tab: Sessions
    key: [date]
    fields:
      date: {type: date, required: true}
      session: {type: choice, choices: [A, B]}
      minutes: {type: number, min: 0, max: 180, unit: min}
      # prefilled from the same day's journal session in the app's form (D-114)
      activity:
        type: choice
        choices: [Climbing indoor, Climbing outdoor, Hangboard, Other]
        from: journal.session.setting+session_type
        from_map:
          "Indoor · Climbing": Climbing indoor
          "Home wall · Climbing": Climbing indoor
          "Outdoor · Climbing": Climbing outdoor
          "Indoor · Hangboard": Hangboard
          "Home wall · Hangboard": Hangboard
      hardest_grade: {type: grade, systems: [french, font, gym], from: journal.session.hardest_grade}
      notes: {type: text, multiline: true}
      # asked on Today the morning after (D-114)
      soreness_next_am: {type: scale, scale: sore, label: Soreness next morning, phase: next_day}
  exercise_log:                 # what was done of each exercise, read against the plan (D-113)
    label: Exercise log
    tab: Exercise log
    key: [date, exercise]
    fields:
      date: {type: date, required: true}
      exercise: {type: ref, reference: exercises, required: true}
      done: {type: text, help: "As done, like 3×10"}
    derived:
      name: "reference.exercises[exercise].name"
      prescribed: "reference.exercises[exercise].prescription[program.week]"
      skipped_by_plan: "prescribed == 'Skip'"

  retest:                       # one row per measure, logged together (D-115)
    label: Retest
    tab: Retests
    key: [date, measure]
    fields:
      date: {type: date, required: true}
      measure: {type: ref, reference: measures, required: true}
      checkpoint: {type: choice, choices: [Start, Middle, End]}
      value: {type: number}
  drill_try:                    # many tries a day, the drill and level kept (D-115)
    label: Drill try
    tab: Drill tries
    key: [date, try_no]
    fields:
      date: {type: date, required: true}
      try_no: {type: integer, min: 1, default: next}
      drill: {type: ref, reference: drills, required: true}
      level: {type: choice, choices: [L1, L2, L3]}
      wobble: {type: scale, scale: sore, label: Wobble}
      notes: {type: text}

forms:
  session: {entity: session}
  # the exercises of a session, one row each, saved together (D-115)
  session_a: {entity: exercise_log, batch_over: {reference: exercises, where: {session: [Warm-up, A]}}}
  session_b: {entity: exercise_log, batch_over: {reference: exercises, where: {session: [Warm-up, B]}}}
  retest: {entity: retest, batch_over: measures, keep_fields: [checkpoint]}
  drill_tries: {entity: drill_try, repeat: true, keep_fields: [drill, level]}
  next_morning: {entity: session, phase: next_day}
