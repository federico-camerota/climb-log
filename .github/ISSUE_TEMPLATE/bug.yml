name: Bug
description: Something does not work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: >
        This repository is public. Do not paste real notes, journal rows or credentials:
        reproduce with fictional values instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Include error messages or logs (without note contents).
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What was expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. make dev
        2. open …
        3. …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Output of `git rev-parse --short HEAD`, or the release.
    validations:
      required: true
  - type: dropdown
    id: backend
    attributes:
      label: Storage backend
      options:
        - Local .xlsx
        - Google Sheets
        - Not relevant
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: This report contains no personal data (real notes, journal values, tokens).
          required: true
