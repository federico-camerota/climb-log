# SPDX-License-Identifier: GPL-3.0-or-later
[project]
name = "climblog"
version = "0.0.0"
description = "Local web app for logging and analysing climbing training, backed by spreadsheets."
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.159.1",
    "pydantic>=2.14.1",
    "ruamel-yaml>=0.19.1",
    "typer>=0.27.3",
    "uvicorn>=0.54.0",
]

[project.scripts]
climblog = "climblog.cli:app"

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "backend"

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["backend", "scripts"]
# Design docs contain sketch code blocks; they are not formatted or linted.
extend-exclude = ["design"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
files = ["backend", "scripts", "tests"]
mypy_path = "scripts"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Lets tests import the dev scripts (e.g. `import check_data`).
pythonpath = ["scripts"]
addopts = "--strict-markers"
# Fail on warnings so deprecations are dealt with when they appear.
filterwarnings = ["error"]
